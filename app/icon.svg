<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" role="img" aria-label="Mindsetis">
<!--
  Site favicon, served by Next's file convention (`app/icon.svg` → a global <link rel="icon">).

  This is the real mark, delivered by the designer 2026-09-23 (Release-1 I5) — it replaces the
  placeholder that used to sit here purely so browsers had something to fetch. Kept as the
  designer exported it, with two edits: the fixed `width`/`height` attributes are dropped so the
  icon scales to whatever box a browser or OS asks for (the `viewBox` carries the geometry), and
  `role`/`aria-label` are added.

  The framing is hers: the mark occupies the middle band of a 16×16 square rather than filling
  it. That is deliberate breathing room — do not crop it tighter to "use the space".

  Gradient stops use `#79B9E3`, which is this project's `color-primary` token (see `colors.css`
  and the email templates' inline tokens) — the icon and the UI share the colour by
  construction, not by coincidence.

  The square PNG siblings (`apple-icon.png`, and the social card in `opengraph-image.png`) are
  raster because their consumers — iOS home screens, social crawlers — do not accept SVG.

  NOTE FOR EDITORS: this is an XML comment, so it must never contain a double hyphen. Writing
  the CSS custom property in full here (with its leading dashes) broke the whole file on
  2026-09-23: browsers parse SVG as strict XML, the document failed with "Unexpected token",
  and the tab silently fell back to no icon at all. Nothing in the build warns about it.
-->
